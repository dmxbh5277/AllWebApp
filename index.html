<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Hub - Premium</title>
    <style>
        /* Reset & Cơ bản */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #0f172a; 
            overscroll-behavior: none;
        }

        /* Container chứa web app */
        #main-container { width: 100%; height: 100vh; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* --- Vùng Assistive Touch (Nút nổi) --- */
        #assistive-touch {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 9999;
            user-select: none;
            touch-action: none; /* Quan trọng: Chặn cuộn trang để ưu tiên kéo nút trên mobile */
            cursor: grab;
        }
        #assistive-touch:active {
            cursor: grabbing;
        }

        /* --- Thiết kế Nút bấm (The Button) --- */
        #touch-btn {
            width: 60px;
            height: 60px;
            
            /* Hiệu ứng Glassmorphism */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            
            display: flex;
            align-items: center;
            justify-content: center;
            
            transition: transform 0.2s ease, background 0.3s ease;
            
            color: rgba(255, 255, 255, 0.9);
            font-size: 28px;
            line-height: 1;
            font-weight: 300;
        }

        #touch-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Khi menu mở, đổi trạng thái nút */
        #assistive-touch.menu-open #touch-btn {
            background: rgba(52, 152, 219, 0.2);
            border-color: rgba(52, 152, 219, 0.5);
            color: #3498db;
        }
        
        #assistive-touch.menu-open #touch-btn .icon-bar { opacity: 0; }
        #assistive-touch.menu-open #touch-btn .icon-close { opacity: 1; }

        #touch-btn .btn-icon {
            position: absolute;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #touch-btn .icon-close { opacity: 0; transform: rotate(-90deg); font-size: 24px; font-weight: bold;}
        #touch-btn .icon-bar { opacity: 1; transform: rotate(0deg); }


        /* --- Thiết kế Menu Popup --- */
        #touch-menu {
            position: absolute;
            bottom: 75px; 
            right: 0;
            width: 220px;
            
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5),
                        0 0 0 1px rgba(0,0,0,0.1);
            
            padding: 8px 0;
            visibility: hidden;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            transform-origin: bottom right;
        }

        #assistive-touch.menu-open #touch-menu {
            visibility: visible;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #touch-menu ul { list-style: none; }

        #touch-menu li {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s ease, color 0.2s ease, padding-left 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
        }
        
        #touch-menu li:last-child { border-bottom: none; }

        #touch-menu li::before {
            content: '•';
            color: #3498db;
            font-size: 20px;
            margin-right: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        #touch-menu li:hover {
            background: rgba(52, 152, 219, 0.15);
            color: #3498db;
            padding-left: 24px;
        }
        
        #touch-menu li:hover::before {
            opacity: 1;
        }

        #touch-menu ul {
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }
        #touch-menu ul::-webkit-scrollbar { width: 4px; }
        #touch-menu ul::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    </style>
</head>
<body>

    <div id="main-container">
        <iframe id="tool-frame" src="https://dmxbh5277.github.io/locpmh/"></iframe>
    </div>

    <!-- Nút Assistive Touch -->
    <div id="assistive-touch">
        <div id="touch-btn">
            <span class="btn-icon icon-bar">☰</span>
            <span class="btn-icon icon-close">✕</span>
        </div>
        
        <div id="touch-menu">
            <ul>
                <li onclick="loadTool('https://dmxbh5277.github.io/locpmh/')">Lọc PMH</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/coupon/')">Lọc Coupon</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/BCQ-/')">Báo cáo quy đổi</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/BH/')">Tính Bảo hiểm</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/THUONGNONG/')">Tra Thưởng Nóng</li>
            </ul>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('assistive-touch');
        const touchMenu = document.getElementById('touch-menu');
        const iframe = document.getElementById('tool-frame');

        let isDragging = false;
        let hasMoved = false;
        let startX, startY, initialX, initialY;

        // --- Xử lý Kéo thả mượt mà bằng Pointer Events ---
        wrapper.addEventListener('pointerdown', (e) => {
            // Nếu bấm vào menu thì không kích hoạt kéo nút
            if (e.target.closest('#touch-menu')) return;

            isDragging = true;
            hasMoved = false;
            startX = e.clientX;
            startY = e.clientY;

            const rect = wrapper.getBoundingClientRect();
            
            // Cố định vị trí hiện tại theo pixel
            wrapper.style.left = rect.left + 'px';
            wrapper.style.top = rect.top + 'px';
            wrapper.style.right = 'auto';
            wrapper.style.bottom = 'auto';
            
            initialX = rect.left;
            initialY = rect.top;

            // Bắt sự kiện con trỏ để kéo mượt kể cả khi ra ngoài khung
            wrapper.setPointerCapture(e.pointerId);

            // Đang chuẩn bị kéo thì đóng menu nếu nó đang mở
            wrapper.classList.remove('menu-open');
        });

        wrapper.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            // Nếu di chuyển vượt quá 5px thì xác nhận đây là thao tác KÉO (không phải bấm mở menu)
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                hasMoved = true;
            }

            let newX = initialX + dx;
            let newY = initialY + dy;

            // Giới hạn nút không bị kéo ra ngoài màn hình
            const btnWidth = wrapper.offsetWidth;
            const btnHeight = wrapper.offsetHeight;
            const margin = 10;

            newX = Math.max(margin, Math.min(newX, window.innerWidth - btnWidth - margin));
            newY = Math.max(margin, Math.min(newY, window.innerHeight - btnHeight - margin));

            wrapper.style.left = newX + 'px';
            wrapper.style.top = newY + 'px';
        });

        wrapper.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            try {
                wrapper.releasePointerCapture(e.pointerId);
            } catch (err) {}

            // Nếu không di chuyển (chỉ chạm nhẹ/click) thì mở hoặc đóng menu
            if (!hasMoved) {
                wrapper.classList.toggle('menu-open');
            }
        });

        // --- Chọn công cụ ---
        function loadTool(url) {
            iframe.src = url;
            wrapper.classList.remove('menu-open');
        }

        // Bấm ra ngoài vùng nút/menu thì tự động đóng menu
        document.addEventListener('click', function(event) {
            const isClickInside = wrapper.contains(event.target);
            if (!isClickInside && wrapper.classList.contains('menu-open')) {
                wrapper.classList.remove('menu-open');
            }
        });

        // Ngăn chặn sự kiện click nổi bọt từ menu ra ngoài
        touchMenu.addEventListener('click', function(e) {
            e.stopPropagation();
        });
    </script>
</body>
</html>
