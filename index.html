<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Viewport chuẩn Mobile: Mở thu phóng, tối ưu không gian hiển thị -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Điện Máy Xanh Bình Hòa - Hub</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. RESET & MOBILE OPTIMIZATION --- */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            /* Dùng 100dvh để xử lý triệt để lỗi mất góc trên iOS Safari & Android Chrome */
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background-color: #002b5c;
            font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            overscroll-behavior: none; /* Chống hiệu ứng nảy trang của iOS */
        }

        /* --- 2. MAIN CONTAINER & IFRAME WRAPPER --- */
        #main-container { 
            width: 100%; 
            height: 100dvh; 
            position: relative; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }

        /* Container bọc iframe: Đảm bảo cuộn cực mượt trên iOS/Android */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* Bắt buộc cho mượt trên iOS Safari */
            position: relative;
        }

        iframe { 
            width: 100%; 
            min-width: 100%;
            height: 100%; 
            min-height: 100%;
            border: none; 
            display: block;
            touch-action: auto;
        }

        /* --- 3. GIAO DIỆN HOME DASHBOARD --- */
        #home-view {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100dvh;
            background: linear-gradient(135deg, #0056b3 0%, #002b5c 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            /* Xử lý Safe Area cho iPhone tai thỏ / đốm camera */
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            color: white;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            overflow-y: auto;
        }

        #home-view.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .home-header {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            font-size: clamp(28px, 8vw, 36px); /* Co giãn font chữ thông minh theo màn hình */
            font-weight: 900;
            text-transform: uppercase;
            color: #ffcc00;
            letter-spacing: 1px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.35);
            line-height: 1.1;
        }

        .home-subtitle {
            font-size: clamp(14px, 4.5vw, 18px);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
            margin-top: 6px;
        }

        /* Grid menu tối ưu mobile */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 420px;
            padding: 5px;
        }

        .home-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            padding: 8px;
        }

        .home-card:active {
            transform: scale(0.95);
            background: rgba(255, 204, 0, 0.25);
            border-color: #ffcc00;
        }

        .home-card .card-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .home-card span {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- 4. ASSISTIVE TOUCH (NÚT NỔI OPTIMIZE MOBILE) --- */
        #assistive-touch {
            position: fixed;
            /* Né khu vực Home Bar của iOS / Android tràn viền */
            bottom: calc(20px + env(safe-area-inset-bottom));
            right: calc(20px + env(safe-area-inset-right));
            z-index: 9999;
            user-select: none;
            touch-action: none;
            cursor: grab;
        }

        #touch-btn {
            width: 56px;
            height: 56px;
            background: rgba(0, 43, 92, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 204, 0, 0.6);
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffcc00;
            font-size: 24px;
        }

        #touch-btn:active {
            transform: scale(0.92);
            background: rgba(0, 86, 179, 0.8);
        }

        /* Menu Popup */
        #touch-menu {
            position: absolute;
            bottom: 68px; 
            right: 0;
            width: 210px;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid rgba(255, 204, 0, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 6px 0;
            visibility: hidden;
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom right;
        }

        #assistive-touch.menu-open #touch-menu {
            visibility: visible;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #touch-menu ul { 
            list-style: none; 
            max-height: 60dvh; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        #touch-menu li {
            padding: 12px 18px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
        }

        #touch-menu li:active {
            background: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
        }

        #touch-menu li.menu-home {
            color: #ffcc00;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 204, 0, 0.25);
        }
    </style>
</head>
<body>

    <!-- Giao diện Trang Chủ -->
    <div id="home-view">
        <div class="home-header">
            <h1 class="main-title">ĐIỆN MÁY XANH</h1>
            <div class="home-subtitle">Bình Hòa</div>
        </div>
        
        <div class="home-grid">
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/locpmh/')">
                <div class="card-icon">🏷️</div>
                <span>Lọc PMH</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/coupon/')">
                <div class="card-icon">🎟️</div>
                <span>Lọc Coupon</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/BCQ-/')">
                <div class="card-icon">📊</div>
                <span>Báo cáo quy đổi</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/BH/')">
                <div class="card-icon">🛡️</div>
                <span>Tính Bảo hiểm</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/combo/')">
                <div class="card-icon"></div>
                <span>Tính Combo</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/THUONGNONG/')">
                <div class="card-icon">🔥</div>
                <span>Tra Thưởng Nóng</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/ketien/')">
                <div class="card-icon">💰</div>
                <span>Kê Tiền</span>
            </div>
        </div>
    </div>

    <!-- Container chứa Iframe kèm Wrapper tối ưu Mobile Scroll -->
    <div id="main-container">
        <div class="iframe-wrapper">
            <iframe id="tool-frame" src="" title="Web App Con"></iframe>
        </div>
    </div>

    <!-- Nút Nổi Assistive Touch -->
    <div id="assistive-touch">
        <div id="touch-btn">
            <span class="btn-icon">☰</span>
        </div>
        
        <div id="touch-menu">
            <ul>
                <li class="menu-home" onclick="goHome()">🏠 Trang chủ Home</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/locpmh/')">Lọc PMH</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/coupon/')">Lọc Coupon</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/BCQ-/')">Báo cáo quy đổi</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/BH/')">Tính Bảo hiểm</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/combo/')">Tính Combo</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/THUONGNONG/')">Tra Thưởng Nóng</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/ketien/')">Kê Tiền</li>
            </ul>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('assistive-touch');
        const touchMenu = document.getElementById('touch-menu');
        const iframe = document.getElementById('tool-frame');
        const homeView = document.getElementById('home-view');

        let isDragging = false;
        let hasMoved = false;
        let startX, startY, initialX, initialY;

        // --- XỬ LÝ KÉO THẢ DÀNH CHO MÀN HÌNH CẢM ỨNG (POINTER EVENTS) ---
        wrapper.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#touch-menu')) return;

            isDragging = true;
            hasMoved = false;
            startX = e.clientX;
            startY = e.clientY;

            const rect = wrapper.getBoundingClientRect();
            wrapper.style.left = rect.left + 'px';
            wrapper.style.top = rect.top + 'px';
            wrapper.style.right = 'auto';
            wrapper.style.bottom = 'auto';
            
            initialX = rect.left;
            initialY = rect.top;

            wrapper.setPointerCapture(e.pointerId);
        });

        wrapper.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
                hasMoved = true;
            }

            let newX = initialX + dx;
            let newY = initialY + dy;

            const btnWidth = wrapper.offsetWidth;
            const btnHeight = wrapper.offsetHeight;
            const margin = 10;

            newX = Math.max(margin, Math.min(newX, window.innerWidth - btnWidth - margin));
            newY = Math.max(margin, Math.min(newY, window.innerHeight - btnHeight - margin));

            wrapper.style.left = newX + 'px';
            wrapper.style.top = newY + 'px';
        });

        wrapper.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            try { wrapper.releasePointerCapture(e.pointerId); } catch (err) {}

            if (!hasMoved) {
                wrapper.classList.toggle('menu-open');
            }
        });

        // --- ĐIỀU HƯỚNG & TẢI TRANG CÓ CACHE-BUSTING ---
        function loadTool(url) {
            // Đính kèm Timestamp phá Cache
            const cacheBuster = 'v=' + Date.now();
            const finalUrl = url.includes('?') ? `${url}&${cacheBuster}` : `${url}?${cacheBuster}`;
            
            iframe.src = finalUrl;
            homeView.classList.add('hidden');
            wrapper.classList.remove('menu-open');
        }

        function goHome() {
            homeView.classList.remove('hidden');
            wrapper.classList.remove('menu-open');
        }

        // Đóng menu khi chạm ra ngoài
        document.addEventListener('pointerdown', function(event) {
            const isClickInside = wrapper.contains(event.target);
            if (!isClickInside && wrapper.classList.contains('menu-open')) {
                wrapper.classList.remove('menu-open');
            }
        });

        touchMenu.addEventListener('pointerdown', function(e) {
            e.stopPropagation();
        });
    </script>
</body>
</html>
