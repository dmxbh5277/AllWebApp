<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Điện Máy Xanh Bình Hòa - Hub</title>
    <!-- Import Google Fonts hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* Reset & Cơ bản */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #f1f5f9; 
            overscroll-behavior: none;
        }

        /* Container chứa web app */
        #main-container { width: 100%; height: 100vh; position: relative; display: flex; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; display: block; flex-grow: 1; }

        /* --- Giao diện Trang Chủ (Home Dashboard) Điện Máy Xanh --- */
        #home-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0056b3 0%, #002b5c 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            color: white;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #home-view.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Tiêu đề văn bản: Viết hoa đều, màu vàng, font hiện đại */
        .home-header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            font-family: 'Google Sans', 'Roboto', sans-serif;
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            color: #ffcc00;
            letter-spacing: 1px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.35);
            line-height: 1.1;
        }

        .home-subtitle {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
            margin-top: 8px;
        }

        /* Danh sách menu dạng ma trận đều (3 cột x 2 hàng) */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 460px;
            padding: 5px;
        }

        .home-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            padding: 12px;
        }

        .home-card:hover {
            background: rgba(255, 204, 0, 0.2);
            border-color: #ffcc00;
            transform: translateY(-4px);
        }

        .home-card .card-icon {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .home-card span {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- Vùng Assistive Touch (Nút nổi) --- */
        #assistive-touch {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 9999;
            user-select: none;
            touch-action: none;
            cursor: grab;
        }
        #assistive-touch:active { cursor: grabbing; }

        /* Nút bấm trong suốt */
        #touch-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 86, 179, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 204, 0, 0.4);
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.3s ease;
            color: #ffcc00;
            font-size: 28px;
            line-height: 1;
            font-weight: 300;
        }
        #touch-btn:active {
            transform: scale(0.95);
            background: rgba(0, 86, 179, 0.3);
        }

        #assistive-touch.menu-open #touch-btn {
            background: rgba(0, 86, 179, 0.4);
            border-color: #ffcc00;
            color: #ffcc00;
        }
        
        #assistive-touch.menu-open #touch-btn .icon-bar { opacity: 0; }
        #assistive-touch.menu-open #touch-btn .icon-close { opacity: 1; }

        #touch-btn .btn-icon {
            position: absolute;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #touch-btn .icon-close { opacity: 0; transform: rotate(-90deg); font-size: 24px; font-weight: bold;}
        #touch-btn .icon-bar { opacity: 1; transform: rotate(0deg); }

        /* --- Thiết kế Menu Popup --- */
        #touch-menu {
            position: absolute;
            bottom: 75px; 
            right: 0;
            width: 230px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 16px;
            border: 1px solid rgba(255, 204, 0, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.1);
            padding: 8px 0;
            visibility: hidden;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            transform-origin: bottom right;
        }

        #assistive-touch.menu-open #touch-menu {
            visibility: visible;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #touch-menu ul { list-style: none; max-height: calc(100vh - 150px); overflow-y: auto; }
        #touch-menu ul::-webkit-scrollbar { width: 4px; }
        #touch-menu ul::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        #touch-menu li {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s ease, color 0.2s ease, padding-left 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
        }
        #touch-menu li:last-child { border-bottom: none; }
        
        #touch-menu li.menu-home {
            color: #ffcc00;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 204, 0, 0.2);
        }

        #touch-menu li::before {
            content: '•';
            color: #ffcc00;
            font-size: 20px;
            margin-right: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        #touch-menu li:hover {
            background: rgba(255, 204, 0, 0.15);
            color: #ffcc00;
            padding-left: 24px;
        }
        #touch-menu li:hover::before { opacity: 1; }
    </style>
</head>
<body>

    <!-- Giao diện trang Home Điện Máy Xanh -->
    <div id="home-view">
        <div class="home-header">
            <h1 class="main-title">ĐIỆN MÁY XANH</h1>
            <div class="home-subtitle">Bình Hòa</div>
        </div>
        
        <div class="home-grid">
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/locpmh/')">
                <div class="card-icon">🏷️</div>
                <span>Lọc PMH</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/coupon/')">
                <div class="card-icon">🎟️</div>
                <span>Lọc Coupon</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/BCQ-/')">
                <div class="card-icon">📊</div>
                <span>Báo cáo quy đổi</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/BH/')">
                <div class="card-icon">🛡️</div>
                <span>Tính Bảo hiểm</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/THUONGNONG/')">
                <div class="card-icon">🔥</div>
                <span>Tra Thưởng Nóng</span>
            </div>
            <div class="home-card" onclick="loadTool('https://dmxbh5277.github.io/ketien/')">
                <div class="card-icon">💰</div>
                <span>Kê Tiền</span>
            </div>
        </div>
    </div>

    <!-- Container chứa iframe web app -->
    <div id="main-container">
        <iframe id="tool-frame" src=""></iframe>
    </div>

    <!-- Nút Assistive Touch -->
    <div id="assistive-touch">
        <div id="touch-btn">
            <span class="btn-icon icon-bar">☰</span>
            <span class="btn-icon icon-close">✕</span>
        </div>
        
        <div id="touch-menu">
            <ul>
                <li class="menu-home" onclick="goHome()">🏠 Trang chủ Home</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/locpmh/')">Lọc PMH</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/coupon/')">Lọc Coupon</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/BCQ-/')">Báo cáo quy đổi</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/BH/')">Tính Bảo hiểm</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/THUONGNONG/')">Tra Thưởng Nóng</li>
                <li onclick="loadTool('https://dmxbh5277.github.io/ketien/')">Kê Tiền</li>
            </ul>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('assistive-touch');
        const touchMenu = document.getElementById('touch-menu');
        const iframe = document.getElementById('tool-frame');
        const homeView = document.getElementById('home-view');

        let isDragging = false;
        let hasMoved = false;
        let startX, startY, initialX, initialY;

        // --- Xử lý Kéo thả mượt mà bằng Pointer Events ---
        wrapper.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#touch-menu')) return;

            isDragging = true;
            hasMoved = false;
            startX = e.clientX;
            startY = e.clientY;

            const rect = wrapper.getBoundingClientRect();
            
            wrapper.style.left = rect.left + 'px';
            wrapper.style.top = rect.top + 'px';
            wrapper.style.right = 'auto';
            wrapper.style.bottom = 'auto';
            
            initialX = rect.left;
            initialY = rect.top;

            wrapper.setPointerCapture(e.pointerId);
            wrapper.classList.remove('menu-open');
        });

        wrapper.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                hasMoved = true;
            }

            let newX = initialX + dx;
            let newY = initialY + dy;

            const btnWidth = wrapper.offsetWidth;
            const btnHeight = wrapper.offsetHeight;
            const margin = 10;

            newX = Math.max(margin, Math.min(newX, window.innerWidth - btnWidth - margin));
            newY = Math.max(margin, Math.min(newY, window.innerHeight - btnHeight - margin));

            wrapper.style.left = newX + 'px';
            wrapper.style.top = newY + 'px';
        });

        wrapper.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            try {
                wrapper.releasePointerCapture(e.pointerId);
            } catch (err) {}

            if (!hasMoved) {
                wrapper.classList.toggle('menu-open');
            }
        });

        // --- Điều hướng ---
        function loadTool(url) {
            iframe.src = url;
            homeView.classList.add('hidden');
            wrapper.classList.remove('menu-open');
        }

        function goHome() {
            homeView.classList.remove('hidden');
            wrapper.classList.remove('menu-open');
        }

        // Bấm ra ngoài vùng nút/menu thì tự động đóng menu
        document.addEventListener('click', function(event) {
            const isClickInside = wrapper.contains(event.target);
            if (!isClickInside && wrapper.classList.contains('menu-open')) {
                wrapper.classList.remove('menu-open');
            }
        });

        touchMenu.addEventListener('click', function(e) {
            e.stopPropagation();
        });
    </script>
</body>
</html>
